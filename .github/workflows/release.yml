name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "restore dependencies and tools"
        run: |
          dotnet restore
          dotnet tool restore

      - name: "build project"
        run: dotnet build

      - name: "generate openapi contract"
        run: dotnet swagger tofile --output openapi.json BookingService.Api/bin/Debug/net10.0/BookingService.Api.dll v1

      - name: "generate release notes"
        run: bash scripts/changelog.sh "${{ github.ref_name }}" > release-notes.md

      - name: "create github release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" openapi.json \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
