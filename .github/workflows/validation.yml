name: validation

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies"
        run: dotnet restore

      - name: "verify formatting (lint)"
        run: dotnet format --verify-no-changes

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bookingservice_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies and tools"
        run: |
          dotnet restore
          dotnet tool restore

      - name: "apply database migrations and seed data"
        run: |
          if command -v pg_isready >/dev/null 2>&1 && pg_isready -h postgres -p 5432 >/dev/null 2>&1; then
            DB_HOST="postgres"
          else
            DB_HOST="localhost"
          fi
          export ConnectionStrings__DefaultConnection="Host=${DB_HOST};Port=5432;Database=bookingservice_db;Username=postgres;Password=postgres"
          dotnet ef database update --project BookingService.Infrastructure --startup-project BookingService.Api
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD=postgres psql -h "${DB_HOST}" -U postgres -d bookingservice_db -f scripts/seed.sql || true
          elif command -v docker >/dev/null 2>&1; then
            docker exec $(docker ps -q -f ancestor=postgres:17-alpine | head -n 1) psql -U postgres -d bookingservice_db -f scripts/seed.sql || true
          fi

      - name: "run tests"
        run: dotnet test --no-restore --verbosity normal
