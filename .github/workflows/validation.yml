name: validation

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies"
        run: dotnet restore

      - name: "verify formatting (lint)"
        run: dotnet format --verify-no-changes

  test:
    name: "Build, Contract & Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies and tools"
        run: |
          dotnet restore
          dotnet tool restore

      - name: "build solution"
        run: dotnet build --no-restore

      - name: "verify openapi contract drift"
        run: |
          dotnet swagger tofile --output openapi.json BookingService.Api/bin/Debug/net10.0/BookingService.Api.dll v1
          git diff --exit-code -- openapi.json

      - name: "verify migrations script generation"
        run: |
          dotnet ef migrations script --idempotent --output migrations.sql --project BookingService.Infrastructure --startup-project BookingService.Api
          rm migrations.sql

      - name: "run tests"
        run: dotnet test --no-restore --verbosity normal
