name: validation

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies"
        run: dotnet restore

      - name: "verify formatting (lint)"
        run: dotnet format --verify-no-changes

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bookingservice_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies and tools"
        run: |
          dotnet restore
          dotnet tool restore

      - name: "apply database migrations"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=bookingservice_db;Username=postgres;Password=postgres"
        run: dotnet ef database update --project BookingService.Infrastructure --startup-project BookingService.Api

      - name: "run tests"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=bookingservice_db;Username=postgres;Password=postgres"
        run: dotnet test --no-restore --verbosity normal
