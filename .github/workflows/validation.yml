name: validation

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint:
    name: "Code Quality & Linting"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies"
        run: dotnet restore

      - name: "verify formatting (lint)"
        run: dotnet format --verify-no-changes

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v4

      - name: "setup dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "install dependencies"
        run: dotnet restore

      - name: "run tests"
        run: dotnet test --no-restore --verbosity normal
